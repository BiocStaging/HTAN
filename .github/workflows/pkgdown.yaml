# Build the pkgdown site on every PR; deploy it to GitHub Pages
# (https://seandavi.github.io/HTAN/) on push to devel.
on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

name: pkgdown

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Built in the Bioconductor devel container, like the bioc-devel check
    # leg, so the articles show what Bioconductor devel computes (the
    # release stack gave different clusters in the analysis article).
    # BiocManager in this image points at devel; Quarto is pre-installed.
    container:
      image: bioconductor/bioconductor_docker:devel
    # The articles are the live vignettes. SYNAPSE_AUTH_TOKEN (read-only)
    # lets the analysis article's Synapse chunks run; fork PRs get no secret,
    # and those chunks then show their code unevaluated.
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      SYNAPSE_AUTH_TOKEN: ${{ secrets.SYNAPSE_AUTH_TOKEN }}
      R_LIBS_USER: /__w/_temp/Library
    steps:
      - uses: actions/checkout@v7

      # pkgdown runs git; the checkout is owned by another user here.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Library cache key
        id: key
        run: |
          mkdir -p "$R_LIBS_USER"
          echo "r=$(Rscript -e 'cat(R.version$major, R.version$minor, as.character(BiocManager::version()), sep = "-")')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: /__w/_temp/Library
          key: pkgdown-rlib-${{ steps.key.outputs.r }}-${{ hashFiles('DESCRIPTION') }}
          restore-keys: |
            pkgdown-rlib-${{ steps.key.outputs.r }}-
            rlib-devel-${{ steps.key.outputs.r }}-

      - name: Install dependencies and HTAN
        shell: Rscript {0}
        run: |
          options(repos = BiocManager::repositories(), Ncpus = 4L)
          need <- setdiff(c("remotes", "pkgdown"),
                          rownames(installed.packages()))
          if (length(need)) install.packages(need)
          remotes::install_deps(dependencies = TRUE, upgrade = "never")
          remotes::install_local(".", dependencies = FALSE, upgrade = "never",
                                 force = TRUE)
          print(BiocManager::version())

      - name: Build site
        shell: Rscript {0}
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
