# R CMD check and BiocCheck on Bioconductor devel.
on:
  push:
    branches: [devel]
  pull_request:
  workflow_dispatch:

name: check

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bioc-devel:
    runs-on: ubuntu-latest
    name: R CMD check + BiocCheck (bioc-devel)
    container:
      image: bioconductor/bioconductor_docker:devel
    env:
      _R_CHECK_FORCE_SUGGESTS_: "false"
      R_KEEP_PKG_SOURCE: "yes"
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          options(repos = BiocManager::repositories(), Ncpus = 4L)
          install.packages(c("remotes", "rcmdcheck", "BiocCheck"))
          remotes::install_deps(dependencies = TRUE, upgrade = "never")

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          args: 'c("--no-manual")'
          build_args: 'c("--no-manual")'
          error-on: '"warning"'

      - name: BiocCheck
        shell: Rscript {0}
        run: |
          res <- BiocCheck::BiocCheck(
              ".", `new-package` = TRUE, `no-check-bioc-help` = TRUE
          )
          errs <- res$error
          if (length(errs)) {
              print(errs)
              quit(status = 1L)
          }
